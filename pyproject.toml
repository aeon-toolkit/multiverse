[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-multiverse"
authors = [
    {name = "aeon developers", email = "contact@aeon-toolkit.org"},
]
maintainers = [
    {name = "aeon developers", email = "contact@aeon-toolkit.org"},
]
version = "0.0.1"
description = "Multiverse Archive loaders and utilities for MTSC benchmarks."
readme = "README.md"
keywords = [
    "aeon-toolkit",
    "data-science",
    "machine-learning",
    "data-mining",
    "time-series",
    "scikit-learn",
    "multivariate-time-series-classification",
    "time-series-clustering",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "aeon>=1.4.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0",
    "tensorflow>=2.12",
]
test = [
    "pytest>=7.0",
]
# Only the experiment drivers need tsml-eval, not the classifiers or the
# result tables. It is an extra rather than a hard dependency because the
# current release, 0.6.0, pins aeon<1.2.0, which cannot be installed beside
# the aeon>=1.4.0 this package needs. tsml-eval's main branch already allows
# aeon<1.6.0, so this becomes installable as soon as that is released.
experiments = [
    "tsml_eval>=0.6",
]

[tool.setuptools.packages.find]
include = ["multiverse*"]

[project.urls]
Homepage = "https://github.com/aeon-toolkit/multiverse"
Repository = "https://github.com/aeon-toolkit/multiverse"
Issues = "https://github.com/aeon-toolkit/multiverse/issues"
