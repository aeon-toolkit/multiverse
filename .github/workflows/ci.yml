name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The ported classifiers need torch, which is an optional extra, so the
      # deep-learning extra has to be installed for the tests to import.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[deep-learning,test]"

      - name: Import check
        run: |
          python -c "import multiverse; print(multiverse.__version__)"
          python -c "from multiverse.classification import ConvTranClassifier, PatchMTSCClassifier, TimesNetClassifier, TimesURLClassifier; print('classifiers import')"

      # Every script under experiments/ and examples/ is an entry point the
      # README sends people to, so a syntax error in one is a user-facing break.
      - name: Compile every module
        run: |
          python -m compileall -q multiverse

      - name: Run tests
        run: |
          python -m pytest multiverse -v --durations=10

      # The equivalence tests skip unless the original sources are present, so
      # they never run above. Fail if they stop being collectable at all.
      - name: Equivalence tests are collectable
        run: |
          python -m pytest multiverse/classification/tests/test_original_equivalence.py --collect-only -q

      - name: Package metadata
        run: |
          python -c "import importlib.metadata as md; print(md.version('aeon-multiverse'))"

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build package
        run: |
          python -m build

      - name: Check built distributions
        run: |
          twine check dist/*
